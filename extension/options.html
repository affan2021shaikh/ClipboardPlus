<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Upload Anywhere — Settings</title>
<link rel="stylesheet" href="options.css" />
</head>
<body>
  <main class="ua-opts">
    <h1>Upload Anywhere</h1>

    <section>
      <label class="ua-toggle">
        <input type="checkbox" id="enabled" />
        <span>Intercept file uploads on websites</span>
      </label>
    </section>

    <section>
      <h2>Default file name format</h2>
      <p class="ua-desc">
        Used to auto-generate a name for pasted or dropped files. Build it from these tokens —
        repeat a letter for a longer form (e.g. <code>YY</code> → <code>26</code>,
        <code>YYYY</code> → <code>2026</code>).
      </p>

      <table class="ua-legend">
        <tr><td><code>Y</code></td><td>Year</td><td class="ua-example" id="ex-Y"></td></tr>
        <tr><td><code>M</code></td><td>Month</td><td class="ua-example" id="ex-M"></td></tr>
        <tr><td><code>D</code></td><td>Day</td><td class="ua-example" id="ex-D"></td></tr>
        <tr><td><code>H</code></td><td>Hour (24h)</td><td class="ua-example" id="ex-H"></td></tr>
        <tr><td><code>m</code></td><td>Minute (lowercase)</td><td class="ua-example" id="ex-m"></td></tr>
        <tr><td><code>s</code></td><td>Second (lowercase)</td><td class="ua-example" id="ex-s"></td></tr>
      </table>

      <label for="format">Format</label>
      <input type="text" id="format" spellcheck="false" autocomplete="off" />

      <p class="ua-preview-label">Preview</p>
      <p class="ua-preview" id="preview"></p>
    </section>

    <div class="ua-save-row">
      <button id="save">Save</button>
      <span id="saved-msg" class="ua-saved-msg" hidden>Saved</span>
    </div>
  </main>
  <script src="format.js"></script>
  <script src="options.js"></script>
</body>
</html>
